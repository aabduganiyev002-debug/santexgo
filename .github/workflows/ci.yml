name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, test, build, migratsiyalar va e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: santexgo
          POSTGRES_USER: santexgo
          POSTGRES_PASSWORD: santexgo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santexgo -d santexgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://santexgo:santexgo_ci@localhost:5432/santexgo

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Kod formati
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tiplar
        run: pnpm typecheck

      - name: Testlar
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Migratsiyalarni toza bazaga qo'llash
        run: pnpm db:deploy

      - name: Baza sxemaga to'liq mosligini tekshirish
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed (ikki marta — qayta ishga tushirish xavfsizligi)
        env:
          ADMIN_PHONE: '+998901234567'
          ADMIN_PASSWORD: ci-admin-password-123
        run: pnpm db:seed && pnpm db:seed

      - name: E2E testlar (API + haqiqiy baza)
        run: pnpm test:e2e

  # Foydalanuvchi kompyuteridagi kabi: toza nusxa → "pnpm setup:local" (Docker bilan) → API
  local-setup:
    name: pnpm setup:local (Linux, Docker bilan)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Birinchi ishga tushirish
        run: pnpm setup:local

      - name: Qayta ishga tushirish (xavfsizligi)
        run: pnpm setup:local

      - name: Barcha xizmatlar javob beradi
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml ps
          docker compose --env-file .env -f docker/docker-compose.yml exec -T redis \
            sh -c 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping' | grep -q PONG

      - name: API ishga tushadi va bazaga ulanadi
        run: |
          pnpm --filter @santexgo/api build
          cd apps/api
          node dist/main.js > api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/api/health; then exit 0; fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Sayt ishga tushadi va sahifalarni ko'rsatadi
        run: |
          pnpm --filter @santexgo/web build
          cd apps/web
          node_modules/.bin/next start --port 3000 > web.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ | grep -q 'SantexGo'
          curl -sf 'http://127.0.0.1:3000/catalog/trubalar?material=ppr' | grep -q 'PPR'
          curl -sf http://127.0.0.1:3000/products/plastherm-ppr-truba-d25-pn20-4-m | grep -q 'PLT-PPR-PN20-25'
          curl -sf http://127.0.0.1:3000/api/v1/catalog/brands | grep -q 'plastherm'
          curl -sf http://127.0.0.1:3000/cart | grep -q 'Savatcha'
          # Kabinet kirmagan foydalanuvchini kirish sahifasiga yo'naltiradi
          curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3000/account | grep -q '/login?next=%2Faccount'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/products/mavjud-emas)
          test "$code" = "404" || { cat web.log; exit 1; }

      - name: Admin panel ishga tushadi
        run: |
          pnpm --filter @santexgo/admin build
          cd apps/admin
          node_modules/.bin/next start --port 3001 > admin.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3001/login; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/login | grep -q 'SantexGo Admin'
          # Kirmagan foydalanuvchi kirish sahifasiga yo'naltiriladi
          curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3001/orders | grep -q '/login?next=%2Forders' || { cat admin.log; exit 1; }

      - name: Xizmatlar loglari (xato bo'lsa)
        if: failure()
        run: docker compose --env-file .env -f docker/docker-compose.yml logs --tail 50

  # Windows'da (Docker'siz): ikki marta bosiladigan SantexGo-ishga-tushirish.bat orqali o'rnatish
  # (xatoda to'xtashi ham), kod formati (qator oxirlari), migratsiya, seed, server oynasi
  # (pnpm dev) va SantexGo-toxtatish.bat, API
  windows:
    name: pnpm setup:local (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: PostgreSQL'ni ishga tushirish (runner'da oldindan o'rnatilgan)
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          $pgService = Get-Service -Name postgresql*
          Set-Service -InputObject $pgService -Status running -StartupType automatic
          Start-Process -FilePath "$env:PGBIN\pg_isready" -Wait -PassThru
          & "$env:PGBIN\psql" -U postgres -c "CREATE USER santexgo WITH PASSWORD 'santexgo_ci' CREATEDB;"
          & "$env:PGBIN\psql" -U postgres -c "CREATE DATABASE santexgo OWNER santexgo;"

      - name: .env (Windows Bloknotidagi kabi CRLF qator oxirlari bilan)
        shell: pwsh
        run: (Get-Content .env.example) -replace '^POSTGRES_PASSWORD=.*', 'POSTGRES_PASSWORD=santexgo_ci' | Set-Content .env

      # Foydalanuvchi faylni ikki marta bosgandek, lekin so'rovlarsiz: Docker'siz
      # ("pnpm setup:local --no-docker"), server va brauzersiz, pauzasiz
      - name: SantexGo-ishga-tushirish.bat (pnpm setup:local --no-docker)
        shell: cmd
        env:
          SANTEXGO_NO_DOCKER: '1'
          SANTEXGO_NO_DEV: '1'
        run: |
          call SantexGo-ishga-tushirish.bat
          if errorlevel 1 exit /b 1

      - name: .bat fayllar CRLF va ASCII, xatoda 1 kodi bilan chiqadi
        shell: pwsh
        env:
          SANTEXGO_NO_DOCKER: '1'
          SANTEXGO_NO_DEV: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($bat in 'SantexGo-ishga-tushirish.bat', 'SantexGo-toxtatish.bat') {
            $text = [IO.File]::ReadAllText((Join-Path $PWD $bat))
            if ($text -match '(?<!\r)\n') { throw "${bat}: qator oxirlari CRLF emas (.gitattributes)" }
            if ($text -match '[^\x00-\x7F]') { throw "${bat}: faqat ASCII belgilar bo'lishi kerak" }
          }

          # 1) Eski Node.js: PATH boshidagi soxta node "v20.11.0" deydi
          $fake = Join-Path $env:RUNNER_TEMP 'eski-node'
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content (Join-Path $fake 'node.cmd') '@echo v20.11.0'
          $realPath = $env:PATH
          $env:PATH = "$fake;$realPath"
          cmd /d /c call SantexGo-ishga-tushirish.bat
          $code = $LASTEXITCODE
          $env:PATH = $realPath
          if ($code -ne 1) { throw "Eski Node.js: chiqish kodi $code (1 kutilgan)" }

          # 2) "pnpm setup:local" xatosi: .env da POSTGRES_PASSWORD bo'sh
          Copy-Item .env .env.asl
          (Get-Content .env.asl) -replace '^POSTGRES_PASSWORD=.*', 'POSTGRES_PASSWORD=' | Set-Content .env
          cmd /d /c call SantexGo-ishga-tushirish.bat
          $code = $LASTEXITCODE
          Move-Item -Force .env.asl .env
          if ($code -ne 1) { throw "pnpm setup:local xatosi: chiqish kodi $code (1 kutilgan)" }
          Write-Host 'OK: ikkala xatoda ham 1 kodi bilan chiqdi'
          exit 0

      - name: Kod formati, lint, tiplar va testlar
        run: pnpm check

      - name: SantexGo-ishga-tushirish.bat serverni ochadi, SantexGo-toxtatish.bat yopadi
        shell: pwsh
        timeout-minutes: 12
        env:
          SANTEXGO_NO_DOCKER: '1'
          SANTEXGO_NO_BROWSER: '1'
          SANTEXGO_NO_PAUSE: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # CI'da server oynasi ko'rinmaydi - uning chiqishi faylga yoziladi
          $env:SANTEXGO_DEV_LOG = Join-Path $env:RUNNER_TEMP 'santexgo-dev.log'

          cmd /d /c call SantexGo-ishga-tushirish.bat
          if ($LASTEXITCODE -ne 0) { throw "Ishga tushirish: chiqish kodi $LASTEXITCODE" }
          Invoke-RestMethod http://127.0.0.1:4000/api/health
          $site = Invoke-WebRequest http://localhost:3000/ -TimeoutSec 180
          if ($site.Content -notmatch 'SantexGo') { throw "Sayt sahifasida 'SantexGo' yo'q" }
          $admin = Invoke-WebRequest http://localhost:3001/login -TimeoutSec 180
          if ($admin.Content -notmatch 'SantexGo Admin') { throw "Admin panelda 'SantexGo Admin' yo'q" }

          # Qayta bosish: server ishlayapti - sozlashsiz, faqat brauzer ochiladi
          $out = cmd /d /c call SantexGo-ishga-tushirish.bat | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0 -or $out -notmatch 'allaqachon ishlayapti') { throw "Qayta bosish: chiqish kodi $code" }

          cmd /d /c call SantexGo-toxtatish.bat
          if ($LASTEXITCODE -ne 0) { throw "To'xtatish: chiqish kodi $LASTEXITCODE" }
          Start-Sleep -Seconds 3
          $window = @(Get-CimInstance Win32_Process -Filter "Name='cmd.exe'" |
            Where-Object CommandLine -like '*title SantexGo server*')
          if ($window.Count) { throw 'Server oynasi yopilmadi' }
          $left = @(Get-NetTCPConnection -State Listen -LocalPort 3000, 3001, 4000 -ErrorAction SilentlyContinue)
          if ($left.Count) { $left | Format-Table LocalAddress, LocalPort, OwningProcess; throw "Portlar bo'shamadi" }
          Write-Host "OK: server ishga tushdi va to'xtatildi"
          exit 0

      - name: Server oynasi logi (xato bo'lsa)
        if: failure()
        shell: pwsh
        run: Get-Content (Join-Path $env:RUNNER_TEMP 'santexgo-dev.log') -Tail 200 -ErrorAction SilentlyContinue

      - name: API ishga tushadi va bazaga ulanadi
        shell: pwsh
        run: |
          pnpm --filter @santexgo/api build
          $api = Start-Process node -ArgumentList 'dist/main.js' -WorkingDirectory apps/api -PassThru `
            -RedirectStandardOutput api.out.log -RedirectStandardError api.err.log
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:4000/api/health; exit 0 } catch { Start-Sleep 2 }
          }
          Get-Content api.out.log, api.err.log
          exit 1

  # Serverdagi kabi: "scripts/prod.sh" bilan production image'lar build qilinadi va to'liq stack
  # (Caddy, HTTPS, baza, Redis, backup) ishga tushiriladi. *.localhost domenlari uchun Caddy
  # sertifikatni o'zining ichki CA'sidan oladi (Let's Encrypt'siz)
  production:
    name: "Production: Docker image'lar va to'liq stack (Caddy, HTTPS, backup)"
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SITE: santexgo.localhost
      ADMIN: admin.santexgo.localhost

    steps:
      - uses: actions/checkout@v6

      - name: docker/.env.production (sinov qiymatlari)
        run: |
          sh scripts/prod.sh init "$SITE" "$ADMIN" ci@example.com
          # API production rejimida Eskiz sozlamalarini talab qiladi (sinovda SMS yuborilmaydi)
          sed -i \
            -e 's/^ESKIZ_EMAIL=.*/ESKIZ_EMAIL=ci@example.com/' \
            -e 's/^ESKIZ_PASSWORD=.*/ESKIZ_PASSWORD=ci-not-real/' \
            -e 's/^SEED_SAMPLE_PRODUCTS=.*/SEED_SAMPLE_PRODUCTS=true/' \
            docker/.env.production
          grep -qx 'ESKIZ_PASSWORD=ci-not-real' docker/.env.production
          grep -qx 'SEED_SAMPLE_PRODUCTS=true' docker/.env.production

      - name: Deploy (image'lar build, migratsiyalar, ishga tushirish)
        run: sh scripts/prod.sh deploy

      - name: Seed (ma'lumotnomalar va namunaviy mahsulotlar)
        run: sh scripts/prod.sh seed

      - name: Admin akkaunt (so'rovlarsiz, muhit o'zgaruvchilari orqali)
        env:
          ADMIN_PHONE: '+998901234567'
          ADMIN_PASSWORD: ci-admin-password-123
        run: sh scripts/prod.sh admin

      - name: Smoke test (Caddy orqali HTTPS)
        run: sh .github/scripts/prod-smoke.sh

      - name: Backup va bazani zaxiradan tiklash
        run: |
          api() {
            curl -sSfk --max-time 30 \
              --resolve "$SITE:443:127.0.0.1" --resolve "$ADMIN:443:127.0.0.1" "$@"
          }
          sh scripts/prod.sh backup
          # Fayl nomlarida vaqt (UTC) — alifbo tartibidagi oxirgisi eng yangisi
          for file in docker/backups/db/santexgo-*.dump; do dump=${file##*/}; done
          test -f "docker/backups/db/$dump"
          echo "Zaxira: $dump"

          # Zaxiradan keyin yangi brend qo'shiladi — tiklangach u yo'qolishi kerak
          jar="$RUNNER_TEMP/cookies"
          api -c "$jar" -o /dev/null -H "Origin: https://$ADMIN" \
            -H 'Content-Type: application/json' \
            -d '{"phone":"+998901234567","password":"ci-admin-password-123"}' \
            "https://$ADMIN/api/v1/auth/login"
          api -b "$jar" -o /dev/null -H "Origin: https://$ADMIN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI tiklash sinovi","slug":"ci-tiklash-sinovi"}' \
            "https://$ADMIN/api/v1/admin/brands"
          grep -q '"slug":"ci-tiklash-sinovi"' <<< "$(api "https://$SITE/api/v1/catalog/brands")" ||
            { echo "✖ Yangi brend saytda ko'rinmadi"; exit 1; }

          CONFIRM=HA sh scripts/prod.sh restore "$dump"

          api --retry 15 --retry-delay 2 --retry-all-errors -o /dev/null "https://$SITE/api/health"
          brands=$(api "https://$SITE/api/v1/catalog/brands")
          grep -q '"slug":"plastherm"' <<< "$brands" ||
            { echo "✖ Tiklangan bazada seed ma'lumotlari yo'q"; exit 1; }
          if grep -q 'ci-tiklash-sinovi' <<< "$brands"; then
            echo "✖ Tiklangan bazada zaxiradan keyin qo'shilgan brend bor"
            exit 1
          fi
          echo "✔ Baza zaxiradan tiklandi: keyin qo'shilgan brend yo'q, qolgan ma'lumotlar joyida"

      - name: Tiklashdan keyin smoke test
        run: sh .github/scripts/prod-smoke.sh

      - name: Konteynerlar holati va loglari (xato bo'lsa)
        if: failure()
        run: |
          test -f docker/.env.production || exit 0
          sh scripts/prod.sh compose ps -a
          sh scripts/prod.sh compose logs --no-color --tail 100

  # Toza serverdagi kabi: scripts/install.sh kodni GitHub'dan o'zi yuklab oladi (checkout'dan faqat
  # o'rnatuvchi va uning sinovi olinadi) va butun stack'ni bitta buyruq bilan ishga tushiradi —
  # avval Eskiz'siz (SMS keyin ulanadi). Ikkinchi marta — yangilash rejimi va Eskiz'ni ulash
  # (git pull + deploy; boshqa sozlamalar va admin o'zgarmaydi)
  installer:
    name: "O'rnatuvchi: toza serverda bitta buyruq bilan"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      INSTALL_DIR: /opt/santexgo
      # Pull request'da — PR branch'i (fork'dan bo'lsa, fork repozitoriysi)
      SANTEXGO_REPO: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
      SANTEXGO_BRANCH: ${{ github.head_ref || github.ref_name }}
      SITE_DOMAIN: santexgo.localhost
      ADMIN_DOMAIN: admin.santexgo.localhost
      ACME_EMAIL: ci@example.com
      ESKIZ_EMAIL: ci@example.com
      # Maxsus belgilar ataylab: bo'shliq, # va $ sozlamalar faylida va konteynerda o'zgarmasin
      ESKIZ_PASSWORD: 'ci not-real #$x'
      ADMIN_PHONE: '+998901234567'
      ADMIN_PASSWORD: ci-admin-password-123
      SEED_SAMPLE_PRODUCTS: 'true'
      SKIP_FIREWALL: '1'

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/install.sh
            .github/scripts/install-unit.sh
          sparse-checkout-cone-mode: false

      - name: Domensiz bepul manzil, o'z domeniga o'tish va Eskiz'siz rejim (funksiyalar)
        run: dash .github/scripts/install-unit.sh

      - name: Noto'g'ri ishga tushirish darhol rad etiladi (root'siz, noto'g'ri qiymatlar)
        run: |
          log=$RUNNER_TEMP/rad.log
          if sh scripts/install.sh > "$log" 2>&1; then echo "✖ root'siz ishladi"; exit 1; fi
          grep -q 'Root huquqi kerak' "$log"
          for bad in SITE_DOMAIN=noto_g_ri "ESKIZ_PASSWORD=it's" ADMIN_PASSWORD=qisqa ADMIN_PHONE=12345; do
            if timeout 120 sudo -E env "$bad" sh scripts/install.sh > "$log" 2>&1; then
              cat "$log"
              echo "✖ Qabul qilindi: $bad"
              exit 1
            fi
            grep '✖' "$log"
          done
          test ! -e /opt/santexgo

      # Eskiz akkaunti hali yo'q: sayt SMS'siz ishga tushadi
      - name: Birinchi o'rnatish, Eskiz'siz (sudo sh install.sh)
        shell: bash
        run: |
          log=$RUNNER_TEMP/install-1.log
          sudo -E env -u ESKIZ_EMAIL -u ESKIZ_PASSWORD sh scripts/install.sh 2>&1 | tee "$log"
          grep -q 'SMS ulanmagan' "$log"

      - name: Kod shu commit'dan, sozlamalar fayli (600), SMS'siz ro'yxatdan o'tish — tushunarli xato
        working-directory: /opt/santexgo
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(sudo git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(sudo stat -c '%a %U' docker/.env.production)" = '600 root'
          sudo grep -qx 'SEED_SAMPLE_PRODUCTS=true' docker/.env.production
          sudo grep -qx 'SMS_PROVIDER=none' docker/.env.production
          test "$(sudo sh scripts/prod.sh compose exec -T api printenv SMS_PROVIDER)" = none
          body=$RUNNER_TEMP/send-code.json
          code=$(curl -sk -o "$body" -w '%{http_code}' --resolve "$SITE_DOMAIN:443:127.0.0.1" \
            -X POST -H "Origin: https://$SITE_DOMAIN" -H 'Content-Type: application/json' \
            --data '{"phone":"+998901112244"}' "https://$SITE_DOMAIN/api/v1/auth/register/send-code")
          cat "$body"; echo
          test "$code" = 503
          grep -q '"code":"SMS_SEND_FAILED"' "$body"

      - name: Smoke test (Caddy orqali HTTPS)
        working-directory: /opt/santexgo
        run: sudo sh .github/scripts/prod-smoke.sh

      - name: Ikkinchi marta — yangilash rejimi va Eskiz'ni ulash (git pull + deploy)
        shell: bash
        run: |
          log=$RUNNER_TEMP/install-2.log
          sudo -E sh scripts/install.sh 2>&1 | tee "$log"
          grep -q 'Rejim: yangilash' "$log"
          grep -q 'Migratsiyalardan oldin zaxira nusxa olinmoqda' "$log"
          grep -q 'Admin akkaunt allaqachon bor' "$log"
          if grep -q 'SMS ulanmagan' "$log"; then echo "✖ Eskiz ulanmadi"; exit 1; fi
          test "$(sudo sh /opt/santexgo/scripts/prod.sh versions | wc -l)" -ge 2

      - name: Eskiz ulandi — paroli sozlamalar faylida va konteynerda o'zgarmagan
        working-directory: /opt/santexgo
        run: |
          sudo grep -qx 'SMS_PROVIDER=eskiz' docker/.env.production
          sudo grep -qxF "ESKIZ_PASSWORD='$ESKIZ_PASSWORD'" docker/.env.production
          test "$(sudo sh scripts/prod.sh compose exec -T api printenv SMS_PROVIDER)" = eskiz
          test "$(sudo sh scripts/prod.sh compose exec -T api printenv ESKIZ_PASSWORD)" = "$ESKIZ_PASSWORD"

      - name: Yangilashdan keyin smoke test
        working-directory: /opt/santexgo
        run: sudo sh .github/scripts/prod-smoke.sh

      - name: Konteynerlar holati va loglari (xato bo'lsa)
        if: failure()
        run: |
          sudo test -f /opt/santexgo/docker/.env.production || exit 0
          sudo sh /opt/santexgo/scripts/prod.sh compose ps -a
          sudo sh /opt/santexgo/scripts/prod.sh compose logs --no-color --tail 100
