packages:
  - apps/*
  - packages/*

# Faqat shu paketlarga o'rnatish skriptlarini ishga tushirishga ruxsat beriladi
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild

# Telemetriya skriptlari ishga tushirilmaydi; SWC tayyor binar fayl bilan keladi (skript shart emas)
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - '@swc/core'
