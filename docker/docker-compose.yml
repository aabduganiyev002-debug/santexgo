# SantexGo — lokal ishlab chiqish uchun infratuzilma.
# Ishga tushirish (loyiha ildizidan): pnpm infra:up
# Barcha portlar faqat 127.0.0.1 ga ochiladi — tashqi tarmoqdan ko'rinmaydi.

name: santexgo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-santexgo}
      POSTGRES_USER: ${POSTGRES_USER:-santexgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida berilishi shart}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD .env faylida berilishi shart}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Ixtiyoriy: S3-mos fayl saqlashni lokal sinash uchun (standart holatda rasmlar diskda saqlanadi).
  # Ishga tushirish: docker compose --profile s3 ... up -d  va apps/api/.env da STORAGE_DRIVER=s3.
  # MinIO bepul Docker image'larini to'xtatgani uchun SeaweedFS ishlatiladi.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: ['s3']
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
